<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Pinnacle Estates</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .hero-background {
            background-image: url('https://images.unsplash.com/photo-1560448100-348f95c4795e?q=80&w=2940&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body class="bg-slate-950">

    <main class="hero-background min-h-screen relative flex items-center justify-center p-4">
        <!-- Superposición oscura -->
        <div class="absolute inset-0 bg-slate-950 opacity-70"></div>

        <!-- Contenido principal -->
        <div class="relative z-10 text-white text-center p-8 max-w-4xl w-full">
            <h1 class="text-5xl md:text-7xl font-extrabold mb-10 leading-tight">
                <span class="text-amber-500">The Pinnacle</span> <span class="text-white">Estates</span>
            </h1>

            <!-- Tarjeta elegante con descripción -->
            <div class="bg-white/10 backdrop-blur-sm rounded-xl p-8 max-w-2xl mx-auto shadow-2xl border-2 border-amber-500 mb-12">
                <p class="text-lg md:text-xl font-light leading-relaxed text-gray-100">
                    Descubre un nuevo estándar de vida en propiedades que redefinen la opulencia. Cada residencia es una obra maestra de diseño y exclusividad, ofreciendo vistas inigualables y servicios personalizados para el cliente más exigente. Vive el lujo sin límites.
                </p>
            </div>

            <!-- Formulario de contacto minimalista -->
            <div class="max-w-xl mx-auto bg-white/5 backdrop-blur-sm rounded-xl p-6 shadow-xl border border-gray-700">
                <h2 class="text-2xl md:text-3xl font-semibold mb-6 text-amber-500">Contáctanos</h2>
                <form class="space-y-5">
                    <div>
                        <input type="text" id="name" name="name" placeholder="Tu Nombre" 
                               class="w-full bg-slate-800/70 text-white placeholder-gray-400 border border-amber-500 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-amber-500 transition duration-300">
                    </div>
                    <div>
                        <input type="email" id="email" name="email" placeholder="Tu Correo Electrónico" 
                               class="w-full bg-slate-800/70 text-white placeholder-gray-400 border border-amber-500 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-amber-500 transition duration-300">
                    </div>
                    <div>
                        <input type="tel" id="phone" name="phone" placeholder="Tu Número de Teléfono (Opcional)" 
                               class="w-full bg-slate-800/70 text-white placeholder-gray-400 border border-amber-500 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-amber-500 transition duration-300">
                    </div>
                    <div>
                        <textarea id="message" name="message" rows="5" placeholder="Tu Mensaje" 
                                  class="w-full bg-slate-800/70 text-white placeholder-gray-400 border border-amber-500 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-amber-500 transition duration-300"></textarea>
                    </div>
                    <div>
                        <button type="submit" 
                                class="w-full bg-amber-500 text-slate-950 font-bold py-3 rounded-lg hover:bg-amber-600 transition duration-300 transform hover:scale-105">
                            Enviar Consulta
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

</body>
</html>
