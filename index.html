<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ $json.Nombre }} | Inmobiliaria de Ultra Lujo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
        }

        .font-serif {
            font-family: 'Playfair Display', serif;
        }

        .hero-overlay {
            background: linear-gradient(to bottom, rgba(2, 6, 23, 0.4), rgba(2, 6, 23, 0.9));
        }
    </style>
</head>

<body class="bg-slate-950 text-slate-200 antialiased">

    <!-- Hero Section -->
    <header class="relative min-h-screen flex items-center justify-center overflow-hidden">
        <!-- Background Image -->
        <div class="absolute inset-0 z-0">
            <div class="absolute inset-0 bg-cover bg-center" style="background-image: url('{{ $json.Fotos[0].url }}');">
            </div>
            <div class="absolute inset-0 hero-overlay z-10"></div>
        </div>

        <!-- Navigation Placeholder -->
        <nav class="absolute top-0 w-full p-8 flex justify-between items-center z-30">
            <div class="text-amber-500 font-serif text-2xl font-bold tracking-widest">LUXE</div>
            <div class="hidden md:flex gap-8 text-sm uppercase tracking-widest text-white/80">
                <a href="#" class="hover:text-amber-500 transition-colors">Propiedades</a>
                <a href="#" class="hover:text-amber-500 transition-colors">Inversión</a>
                <a href="#" class="hover:text-amber-500 transition-colors">Contacto</a>
            </div>
        </nav>

        <!-- Main Content -->
        <div class="relative z-20 container mx-auto px-6 text-center">
            <h1 class="text-5xl md:text-8xl font-serif text-white mb-6 uppercase tracking-tight">
                {{ $json.Nombre }}
            </h1>

            <div class="max-w-2xl mx-auto">
                <div
                    class="bg-slate-950/40 backdrop-blur-xl border border-amber-500/20 p-8 md:p-12 rounded-3xl shadow-2xl relative overflow-hidden group">
                    <!-- Subtle Glow -->
                    <div
                        class="absolute -top-24 -left-24 w-48 h-48 bg-amber-500/10 rounded-full blur-3xl group-hover:bg-amber-500/20 transition-all duration-700">
                    </div>

                    <p class="text-lg md:text-xl text-slate-300 leading-relaxed font-light mb-8 italic">
                        "{{ $json.Descripción }}"
                    </p>

                    <div class="w-16 h-px bg-amber-500 mx-auto mb-8"></div>

                    <a href="#contacto"
                        class="inline-block bg-amber-500 hover:bg-amber-600 text-slate-950 px-10 py-4 rounded-full text-sm font-bold uppercase tracking-widest transition-all hover:scale-105 shadow-lg shadow-amber-500/20">
                        Solicitar Dossier Exclusivo
                    </a>
                </div>
            </div>
        </div>

        <!-- Scroll Indicator -->
        <div class="absolute bottom-10 left-1/2 -translate-x-1/2 z-20 animate-bounce">
            <div class="w-px h-12 bg-gradient-to-b from-amber-500 to-transparent"></div>
        </div>
    </header>

    <!-- Footer / Contact Form -->
    <section id="contacto" class="py-24 bg-slate-950">
        <div class="container mx-auto px-6">
            <div class="max-w-xl mx-auto">
                <div class="text-center mb-12">
                    <h2 class="text-3xl font-serif text-amber-500 mb-4 uppercase tracking-widest">Contacto Directo</h2>
                    <p class="text-slate-500 text-sm">Privacidad y discreción absoluta para inversores exclusivos.</p>
                </div>

                <form class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <input type="text" placeholder="NOMBRE COMPLETO"
                            class="bg-transparent border-b border-slate-800 py-3 px-2 text-sm focus:outline-none focus:border-amber-500 transition-colors uppercase tracking-widest w-full">
                        <input type="email" placeholder="CORREO ELECTRÓNICO"
                            class="bg-transparent border-b border-slate-800 py-3 px-2 text-sm focus:outline-none focus:border-amber-500 transition-colors uppercase tracking-widest w-full">
                    </div>
                    <div>
                        <textarea placeholder="MENSAJE" rows="1"
                            class="bg-transparent border-b border-slate-800 py-3 px-2 text-sm focus:outline-none focus:border-amber-500 transition-colors uppercase tracking-widest w-full"></textarea>
                    </div>
                    <div class="pt-6">
                        <button
                            class="w-full border border-amber-500/50 text-amber-500 hover:bg-amber-500 hover:text-slate-950 py-4 rounded-lg text-xs font-bold uppercase tracking-[0.3em] transition-all duration-300">
                            Enviar Solicitud
                        </button>
                    </div>
                </form>

                <div class="mt-20 text-center border-t border-slate-900 pt-12">
                    <p class="text-[10px] text-slate-600 uppercase tracking-[0.5em] mb-4">© 2026 Residencia de Ultra
                        Lujo | {{ $json.Nombre }}</p>
                    <div class="flex justify-center gap-6">
                        <span class="w-1.5 h-1.5 rounded-full bg-amber-500/20"></span>
                        <span class="w-1.5 h-1.5 rounded-full bg-amber-500/20"></span>
                        <span class="w-1.5 h-1.5 rounded-full bg-amber-500/20"></span>
                    </div>
                </div>
            </div>
        </div>
    </section>

</body>

</html>
